<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyDownloader</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="app-layout">

        <!-- ═══════════════════════════════════════ -->
        <!--  TOP BAR                                -->
        <!-- ═══════════════════════════════════════ -->
        <header class="topbar">
            <input type="text" id="url-input" placeholder="🔗 Enter file URL here..." />
            <button id="add-download-btn">+ Add Download</button>
            <button id="theme-toggle">🌙</button>
            <button id="settings-btn">⚙</button>
        </header>

        <!-- ═══════════════════════════════════════ -->
        <!--  SIDEBAR                                -->
        <!-- ═══════════════════════════════════════ -->
        <aside class="sidebar">

            <!-- Navigation Menu -->
            <nav class="nav-menu">
                <a class="nav-item active" data-view="downloads">📥 Downloads</a>
                <a class="nav-item" data-view="history">🕐 History</a>
                <a class="nav-item" data-view="categories">📂 Categories</a>
                <a class="nav-item" data-view="settings">⚙ Settings</a>
            </nav>

            <!-- Categories List -->
            <div class="categories-list">
                <span class="categories-label">CATEGORIES</span>
                <a class="cat-item active" data-cat="all">📁 All Files <span id="cat-all">0</span></a>
                <a class="cat-item" data-cat="video">🎬 Video <span id="cat-video">0</span></a>
                <a class="cat-item" data-cat="audio">🎵 Audio <span id="cat-audio">0</span></a>
                <a class="cat-item" data-cat="compressed">📦 Compressed <span id="cat-compressed">0</span></a>
                <a class="cat-item" data-cat="document">📄 Documents <span id="cat-document">0</span></a>
                <a class="cat-item" data-cat="other">❓ Others <span id="cat-other">0</span></a>
            </div>

            <!-- Storage Widget -->
            <div class="storage-widget">
                <div class="storage-info">
                    <span>Storage</span>
                    <span id="storage-percent">--</span>
                </div>
                <div class="storage-bar">
                    <div class="storage-fill" id="storage-fill" style="width: 0%"></div>
                </div>
                <p id="storage-text">Calculating...</p>
            </div>

        </aside>

        <!-- ═══════════════════════════════════════ -->
        <!--  MAIN CONTENT                           -->
        <!-- ═══════════════════════════════════════ -->
        <main class="main-content">

            <!-- Active Downloads Section -->
            <section class="active-downloads">
                <h2>Active Downloads <span id="active-count">(0)</span></h2>
                <div id="downloads-list">
                    <!-- JS se download cards yahan inject honge -->
                </div>
            </section>

            <!-- Recent Downloads / History Table -->
            <section class="recent-downloads">
                <div class="section-header">
                    <h2>Recent Downloads</h2>
                    <button id="clear-history-btn">Clear History</button>
                </div>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Size</th>
                            <th>Type</th>
                            <th>Completed</th>
                            <th>Location</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <!-- JS se history rows yahan inject honge -->
                    </tbody>
                </table>
            </section>

        </main>

    </div>

    <script src="main.js"></script>
</body>

</html>
